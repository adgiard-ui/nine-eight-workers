name = "hello-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY is intentionally NOT set here — never commit secrets to
# wrangler.toml, even in [vars]. Instead:
#   Local dev:   create workers/hello-agent/.dev.vars with
#                ANTHROPIC_API_KEY=sk-ant-...
#   Production:  wrangler secret put ANTHROPIC_API_KEY
